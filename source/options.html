<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Hide Applied Jobs LinkedIn Options</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <h2>Hide Applied Jobs LinkedIn</h2>

    <section id="mode-toggle" class="section">
        <span class="section-title">Action on matched jobs</span>
        <div class="option-row">
            <input type="radio" id="modeNone" name="mode" value="none">
            <label for="modeNone">No action</label>
        </div>
        <div class="option-row">
            <input type="radio" id="modeHide" name="mode" value="hide" checked>
            <label for="modeHide">Hide jobs</label>
        </div>
        <div class="option-row">
            <input type="radio" id="modeHighlight" name="mode" value="highlight">
            <label for="modeHighlight">Highlight jobs</label>
        </div>
        <div class="option-row highlight-color-row" id="highlightColorRow" hidden>
            <label for="highlightColor">Highlight color</label>
            <input type="color" id="highlightColor" class="color-input" value="#ffeaea">
        </div>
    </section>

    <section id="toggle" class="section">
        <span class="section-title">Matching options</span>
        <div class="option-row">
            <input type="checkbox" id="matchAppliedToggle" checked>
            <label for="matchAppliedToggle">Jobs you have applied to</label>
        </div>
        <div class="option-row">
            <input type="checkbox" id="matchKeywordsToggle" checked>
            <label for="matchKeywordsToggle">Jobs matching keywords</label>
        </div>
        <div class="keyword-options" id="keywordOptions">
            <span class="subheader">Keyword options</span>
            <label for="keywords">Keywords (comma-separated)</label>
            <input type="text" id="keywords" placeholder="e.g. Promoted, Remote">
            <div class="option-row">
                <input type="checkbox" id="caseInsensitiveToggle" checked>
                <label for="caseInsensitiveToggle">Case-insensitive filtering</label>
            </div>
        </div>
        <p id="noMatchWarning" class="no-match-warning" hidden>No jobs will be matched with the current settings.</p>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
    <button id="save" type="button">Save</button>

    <script src="options.js" type="module"></script>
</body>
</html>
